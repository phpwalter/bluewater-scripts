name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        run: python -c "import os; from bluewater import __version__; expected='v'+__version__; actual=os.environ['GITHUB_REF_NAME']; assert actual == expected, f'{actual} != {expected}'"
      - name: Run tests
        run: python -m pytest --cov=bluewater --cov-report=term-missing
      - name: Run governance
        run: python -m bluewater ci validate
      - name: Validate documentation
        run: python -m bluewater docs check
      - name: Build distributions
        run: python -m build
      - name: Verify wheel contents
        run: python tools/verify_distribution.py dist
      - name: Verify installed wheel
        run: python tools/verify_installed_distribution.py dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bluewater-scripts-${{ github.ref_name }}
          path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Bluewater Scripts ${GITHUB_REF_NAME}"
