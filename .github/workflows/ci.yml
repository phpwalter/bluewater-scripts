name: CI

on:
  push:
    branches: [main, foundation]
  pull_request:
    branches: [main, foundation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests tools/verify_distribution.py tools/verify_installed_distribution.py
      - name: Mypy
        run: python -m mypy src/bluewater
      - name: Tests
        run: python -m pytest --cov=bluewater --cov-report=term-missing --junitxml=test-results.xml
      - name: Build distribution
        run: python -m build --wheel
      - name: Verify distribution contents
        run: python tools/verify_distribution.py dist
      - name: Verify installed distribution
        run: python tools/verify_installed_distribution.py dist
      - name: Machine-readable governance
        run: python -m bluewater ci validate --format json > bluewater-diagnostics.json
      - name: Governance
        if: success()
        run: python -m bluewater check --scope all
      - name: Upload distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            bluewater-diagnostics.json
            test-results.xml
          if-no-files-found: warn
