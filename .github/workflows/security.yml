name: Security

on:
  push:
    branches: [main, foundation]
  pull_request:
    branches: [main, foundation]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install audit tooling
        run: python -m pip install -e . pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit

  dependency-review:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependency review unavailable
        run: echo "Enable GitHub Dependency Graph before activating dependency-review-action."
